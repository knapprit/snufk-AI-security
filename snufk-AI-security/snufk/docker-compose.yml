services:
  kafka:
    image: public.ecr.aws/bitnami/kafka:3.7
    container_name: kafka-kraft
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      # Добавлен PLAINTEXT_HOST://:29092 в LISTENERS
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      # Теперь рекламируем оба пути корректно
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,PLAINTEXT_HOST://kafka:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - ALLOW_ANONYMOUS_LOGIN=yes
      - KAFKA_CFG_KRAFT_CLUSTER_ID=626fbd00-5e82-4f3a-867c-d6a457788478
    volumes:
      - kafka_data:/bitnami/kafka

  suricata:
    image: m.daocloud.io/docker.io/jasonish/suricata:6.0.10
    container_name: snufk-suricata-1
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./suricata/logs:/var/log/suricata
      - ./suricata/config:/etc/suricata
    command: -i eth0 --init-errors-fatal

  zeek:
    image: m.daocloud.io/docker.io/blacktop/zeek:latest
    container_name: snufk-zeek-1
    network_mode: host
    volumes:
      - ./zeek/logs:/pcap
    entrypoint: zeek
    command: -i eth0 local

  ai-brain:
    build: ./ai-analyser
    container_name: snufk-brain-1
    depends_on:
      - kafka
    environment:
      - PYTHONUNBUFFERED=1
    restart: always
volumes:
 kafka_data:
   driver: local